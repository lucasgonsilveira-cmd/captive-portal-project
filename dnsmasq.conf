# ============================================================================
# DNSMASQ.CONF — DHCP + DNS do hotspot
# ============================================================================
# O dnsmasq faz duas coisas aqui:
#   1. DHCP: dá um número de IP automaticamente pra cada dispositivo que
#      conecta no wifi (sem isso, o celular do usuário nem saberia que
#      endereço usar na rede)
#   2. DNS: resolve os nomes de site (google.com, etc.) — e é aqui que
#      fazemos a "mágica" do portal cativo, apontando TODOS os domínios
#      para o IP do próprio servidor.
#
# Onde colocar este arquivo (padrão Ubuntu/Debian):
#   /etc/dnsmasq.conf
#
# Como rodar manualmente:
#   sudo dnsmasq -C /etc/dnsmasq.conf -d   (-d = modo debug, roda na frente)
# ============================================================================

# Interface onde o dnsmasq vai escutar pedidos de DHCP/DNS
# (a MESMA interface configurada no hostapd.conf)
interface=wlo1

# ----------------------------------------------------------------------
# DHCP — faixa de IPs distribuídos aos convidados
# ----------------------------------------------------------------------
# 192.168.50.10 até 192.168.50.17 = 8 endereços disponíveis,
# batendo com o limite de 8 usuários definido no hostapd.conf.
# "12h" = cada IP fica reservado ao dispositivo por 12 horas.
dhcp-range=192.168.50.10,192.168.50.17,255.255.255.0,12h

# IP fixo desta própria máquina dentro da rede do hotspot.
# Esse é o endereço que os dispositivos vão enxergar como "roteador".
# Ele precisa ser o MESMO IP configurado manualmente na interface wlan1
# (veja o comando de configuração de IP no README.md).
listen-address=192.168.50.1

# ----------------------------------------------------------------------
# DNS — redirecionamento para o portal cativo
# ----------------------------------------------------------------------
# address=/#/IP  responde para QUALQUER domínio (o "#" é um coringa)
# com o IP indicado. Ou seja: quando o celular perguntar "qual o IP de
# google.com?", a resposta vai ser sempre 192.168.50.1 (o próprio
# servidor do portal). Combinado com a regra de firewall que redireciona
# a porta 80, é isso que faz o portal aparecer automaticamente.
address=/#/192.168.50.1

# Não usa o /etc/resolv.conf do sistema como fonte adicional de DNS —
# queremos que TODA resolução de nome passe pela regra acima.
no-resolv
