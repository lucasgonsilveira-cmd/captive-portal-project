# ============================================================================
# HOSTAPD.CONF — cria a rede wifi do hotspot (modo Access Point)
# ============================================================================
# Esse arquivo diz para uma interface de rede wifi "vire" um roteador,
# transmitindo sua própria rede em vez de só se conectar em outras.
#
# Onde colocar este arquivo (padrão do Ubuntu/Debian):
#   /etc/hostapd/hostapd.conf
#
# Como rodar manualmente (bom para testar):
#   sudo hostapd /etc/hostapd/hostapd.conf
# ============================================================================

# Interface de rede que vai ficar em modo Access Point.
# IMPORTANTE: essa interface precisa suportar "modo AP" — verifique com:
#   iw list   (procure por "AP" na seção "Supported interface modes")
interface=wlo1

# Driver padrão, compatível com a grande maioria dos chipsets wifi no Linux
driver=nl80211

# Nome da rede que vai aparecer para os celulares/notebooks dos convidados
ssid=TCC-Fatec-Jahu

# Faixa de frequência: "g" = 2.4GHz.
# Escolhido por compatibilidade: praticamente qualquer celular, mesmo
# antigo, enxerga redes 2.4GHz (5GHz nem todo aparelho suporta).
hw_mode=g

# Canal do wifi. 1, 6 e 11 são os únicos que não se sobrepõem entre si
# no 2.4GHz — bom para reduzir interferência com outras redes no local.
channel=6

# ----------------------------------------------------------------------
# LIMITE DE USUÁRIOS SIMULTÂNEOS
# ----------------------------------------------------------------------
# Conforme combinado para a apresentação: no máximo 8 dispositivos
# conectados ao mesmo tempo.
max_num_sta=8

# ----------------------------------------------------------------------
# SEGURANÇA DA REDE WIFI
# ----------------------------------------------------------------------
# Rede ABERTA (sem senha) DE PROPÓSITO — o controle de quem navega ou
# não é feito pelo portal cativo (Flask + iptables), não por senha de wifi.
auth_algs=1
wpa=0

# ----------------------------------------------------------------------
# OUTRAS OPÇÕES
# ----------------------------------------------------------------------
# 0 = transmite o nome da rede normalmente (não fica "escondida")
ignore_broadcast_ssid=0
